# Scheme (e): ONE domain per early-signal type, plus an impact domain (Phase 5b, H-S1).
#
# The detector flags pre-encryption activity only with >= 2 DISTINCT early-signal types
# (detection/classifier.py, EARLY_MIN_DISTINCT_SIGNAL_TYPES). With one early type per domain,
# no domain-scoped analysis (a B2 instance, a MAS specialist or coordinator) can ever flag
# before the impact stage; only an incident-wide view (B1, MAS Strategic) can correlate the
# early stages. No agent or graph code differs from the other schemas.
#
# Thresholds are NOT new. Each specialist copies the threshold its event types have in
# domains_by_system_area.yaml (network_enumeration 0.35, privilege_escalation_attempt 0.25,
# service_stop_attempt 0.25, backup_recovery_tamper 0.35, impact types 0.35). Each coordinator
# copies the threshold of the by_system_area coordinator its types came from (network 0.50,
# endpoint_host 0.35, endpoint_host 0.35, backup 0.50, filesystem 0.50). Fixed before any run
# on this schema (docs/hypotheses.md, H-S1). Event types no generator emits are routed as in
# by_system_area, so every schema accepts the same vocabulary.

domains:
  - name: discovery
    description: "Discovery only (T1018/T1135)."
    scope: "Network enumeration and related east-west reconnaissance."
    coordinator:
      id: discovery-coordinator
      escalation_policy:
        escalation_confidence_threshold: 0.50
    specialists:
      - id: discovery-monitor
        type: network_sensor
        managed_element: "east-west traffic flow analyzer"
        handles:
          - "network_enumeration"  # T1018/T1135
          - "lateral_movement_signature"
          - "c2_beacon_match"
        escalation_policy:
          escalation_confidence_threshold: 0.35

  - name: privilege
    description: "Privilege escalation only (T1068/T1078)."
    scope: "Process execution and account use on endpoints."
    coordinator:
      id: privilege-coordinator
      escalation_policy:
        escalation_confidence_threshold: 0.35
    specialists:
      - id: privilege-monitor
        type: endpoint_sensor
        managed_element: "endpoint process execution control"
        handles:
          - "privilege_escalation_attempt"  # T1068/T1078
          - "suspicious_process_spawn"
          - "known_ransomware_signature"
        escalation_policy:
          escalation_confidence_threshold: 0.25

  - name: defense_evasion
    description: "Defense evasion only (T1489)."
    scope: "Security-agent and service tampering."
    coordinator:
      id: defense-evasion-coordinator
      escalation_policy:
        escalation_confidence_threshold: 0.35
    specialists:
      - id: defense-evasion-monitor
        type: endpoint_integrity_sensor
        managed_element: "security-agent process/service watchdog"
        handles:
          - "service_stop_attempt"  # T1489
          - "edr_process_kill_attempt"
          - "security_service_disable"
        escalation_policy:
          escalation_confidence_threshold: 0.25

  - name: recovery_inhibition
    description: "Inhibit system recovery only (T1490)."
    scope: "Backup / shadow-copy tampering."
    coordinator:
      id: recovery-inhibition-coordinator
      escalation_policy:
        escalation_confidence_threshold: 0.50
    specialists:
      - id: recovery-inhibition-monitor
        type: backup_sensor
        managed_element: "backup integrity and snapshot policy"
        handles:
          - "backup_recovery_tamper"  # T1490
          - "backup_deletion_attempt"
          - "shadow_copy_tamper"
        escalation_policy:
          escalation_confidence_threshold: 0.35

  - name: impact
    description: "Impact (T1486)."
    scope: "Encryption writes, mass modification and ransom artifacts."
    coordinator:
      id: impact-coordinator
      escalation_policy:
        escalation_confidence_threshold: 0.50
    specialists:
      - id: impact-monitor
        type: file_integrity_sensor
        managed_element: "file-share write-pattern monitor"
        handles:
          - "file_write"  # T1486
          - "mass_file_modification"  # T1486
          - "ransom_note_creation"  # T1486
          - "mass_file_encryption_pattern"
          - "ransom_note_write"
        escalation_policy:
          escalation_confidence_threshold: 0.35
